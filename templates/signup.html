<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Create</title>
</head>

<body>
    <div class="container">
    <div class="form">
        <h2>Account Create</h2>
        <form action="/addAccount" method="post">
            <input type="text" placeholder="username" name="username" required><br>
            <input type="password" placeholder="password" name="password" required><br>
            <input type="password" placeholder="confirm password" name="confirmPassword" required><br>
            <button>submit</button><br>
            <div class="signin">
                <span>If you have a account <a href="/">Signin/login</a></span>
            </div>
        </form>
    </div>
    {%if msg%}
    <span class="msg">{{msg}}</span>
    {%endif%}
    </div>
</body>
<style>
    body{
        display: grid;
        place-items: center;
    }
    .container {
        margin-top: 150px;
        text-align: center;
        box-shadow: 0px 0px 20px 2px gray;
        height: 300px;
        width: 400px;
        border-radius: 5px;
        margin-bottom: 20px;
        justify-content: center;
        align-items: center;
    }
    
    .form input{
        height: 20px;
        margin-bottom: 20px;
        text-align: center;
    }
    .form button{
        background-color: rgb(8, 224, 231);
        border-radius: 5px;
        margin-bottom: 10px;
    }
    .form button:hover{
        scale: 1.1;
        background-color: rgb(0, 247, 255);
    }
    .signin{
        margin-bottom: 10px;
    }
    .msg{
        animation: fade 10s;
        color: red;
        opacity: 0;   
    }
    @keyframes fade{
        0%{opacity: 0;}
        10%{opacity: 1;}
        80%{opacity: 0;}
    }
</style>

</html>
